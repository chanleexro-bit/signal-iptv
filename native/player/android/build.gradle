apply plugin: 'com.android.library'

def capVar = { String name, def fallback -> project.hasProperty(name) ? rootProject.ext.get(name) : fallback }
def media3Version = '1.8.0'

android {
    namespace = 'com.signaliptv.player'
    compileSdk = capVar('compileSdkVersion', 36)
    defaultConfig {
        minSdk = capVar('minSdkVersion', 24)
        targetSdk = capVar('targetSdkVersion', 36)
    }
    buildTypes {
        release { minifyEnabled = false }
    }
    lint { abortOnError = false }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:${capVar('androidxAppCompatVersion', '1.7.1')}"
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
}

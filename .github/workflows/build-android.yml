name: Build Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'media/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
  KS_PASS: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}

jobs:
  apk:
    name: APK (GitHub download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        run: VERSION_CODE=$((200 + GITHUB_RUN_NUMBER)) VERSION_NAME=2.0.$GITHUB_RUN_NUMBER bash scripts/build-android.sh full
      - uses: actions/upload-artifact@v4
        with: { name: SignalIPTV-apk, path: SignalIPTV.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Signal IPTV 2.0.${{ github.run_number }}
          files: SignalIPTV.apk

  play:
    name: App bundle (Google Play)
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build signed app bundle
        run: VERSION_CODE=$((200 + GITHUB_RUN_NUMBER)) VERSION_NAME=2.0.$GITHUB_RUN_NUMBER bash scripts/build-android.sh play
      - name: Verify signature
        run: jarsigner -verify SignalIPTV-play.aab | tail -2
      - uses: actions/upload-artifact@v4
        with: { name: SignalIPTV-play-aab, path: SignalIPTV-play.aab }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: SignalIPTV-play.aab

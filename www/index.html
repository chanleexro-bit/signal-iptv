<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="color-scheme" content="dark">
<title>Signal IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- Bundled in the Android app; desktop browsers fall back to the CDN copy. -->
<script src="hls.min.js"></script>
<script>if(!window.Hls)document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"><\/script>')</script>
</head>
<body>
<div id="app" class="app">
  <nav id="rail" class="rail" aria-label="Sections"></nav>
  <div class="main">
    <header id="top" class="top"></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
</div>

<section id="wp" class="wp" data-modal hidden aria-label="Video player">
  <div class="wp-stage"><video id="wpv" playsinline></video></div>
  <div class="wp-top">
    <button class="wp-btn" data-wp="close" aria-label="Close player">← Back</button>
    <div class="wp-titles"><div id="wpTitle" class="wp-title"></div><div id="wpSub" class="wp-sub"></div></div>
    <span class="wp-live">LIVE</span>
    <button class="wp-btn" id="wpFit" data-wp="fit">⤢ Fit</button>
  </div>
  <div id="wpStatus" class="wp-status" hidden></div>
  <div id="wpMsg" class="wp-msg" hidden></div>
  <div class="wp-bottom">
    <div class="wp-seekrow"><input id="wpSeek" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="wpTime" class="wp-time">0:00</span></div>
    <div class="wp-ctrls">
      <div class="wp-group" id="wpMulti"><button class="wp-btn" data-wp="prev" aria-label="Previous">⏮</button></div>
      <button class="wp-btn wp-vod" data-wp="back10" aria-label="Back 10 seconds">−10</button>
      <button class="wp-btn wp-main" id="wpPlay" data-wp="play" aria-label="Pause">❚❚</button>
      <button class="wp-btn wp-vod" data-wp="fwd10" aria-label="Forward 10 seconds">+10</button>
      <button class="wp-btn wp-next" data-wp="next" aria-label="Next">⏭</button>
      <span class="wp-spacer"></span>
      <select id="wpSpeed" class="wp-sel wp-vod" aria-label="Playback speed">
        <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
      </select>
      <select id="wpAudio" class="wp-sel" aria-label="Audio track" hidden></select>
      <select id="wpSubs" class="wp-sel" aria-label="Subtitles" hidden></select>
      <button class="wp-btn" data-wp="fs" aria-label="Full screen">⛶</button>
    </div>
  </div>
</section>

<section id="sheet" class="sheet" data-modal hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBody"></div></div>
</section>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

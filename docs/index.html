<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal IPTV</title>
<style>
:root{--bg:#0f1115;--fg:#e9ebf0;--muted:#9aa1af;--line:#272b34;--accent:#ff5a3f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:56px max(16px,env(safe-area-inset-left,0px))}
main{max-width:62ch;margin:0 auto}
h1{font-size:44px;line-height:1.05;margin:0 0 12px;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:32px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
p{color:var(--muted)} a{color:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:#140a08;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:8px;margin:8px 0}
footer{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>Signal IPTV</div>
  <h1>Live TV from M3U playlists, with a TV guide.</h1>
  <p>Signal IPTV plays live channels from M3U playlists you choose and shows what’s on now and next. No account, no subscription.</p>
  <a class="btn" href="https://github.com/chanleexro-bit/signal-iptv/releases/latest">Download for Android</a>
  <footer><a href="privacy.html">Privacy Policy</a> · <a href="https://github.com/chanleexro-bit/signal-iptv">Source code</a> · Signal IPTV doesn’t host or provide any channels.</footer>
</main>
</body>
</html>
